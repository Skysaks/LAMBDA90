name: Mise à jour Lambda 90
on:
  schedule:
    - cron: "0 5 * * *"   # chaque jour 7 h (Paris, heure d'été)
  workflow_dispatch: {}
concurrency: { group: lambda90-data, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pandas scipy scikit-learn statsmodels
      - name: Données ouvertes
        run: |
          git clone --depth 1 https://github.com/xgabora/Club-Football-Match-Data-2000-2025.git /tmp/xg
          git clone --depth 1 https://github.com/openfootball/football.json.git /tmp/of
      - name: Résultats récents (football-data.org)
        env: { FOOTBALL_DATA_TOKEN: "${{ secrets.FOOTBALL_DATA_TOKEN }}" }
        run: python pipeline/fetch_results.py
      - name: Cotes (The Odds API)
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python pipeline/fetch_odds.py
      - name: Blessures et suspensions (API-Football)
        env: { API_FOOTBALL_KEY: "${{ secrets.API_FOOTBALL_KEY }}" }
        run: python pipeline/fetch_lineups.py jour out
      - name: Réglage et backtest complets (le lundi)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python engine3.py /tmp/xg/data /tmp/of out tune
            python engine3.py /tmp/xg/data /tmp/of out full
            python engine3_eval.py out
            python pipeline/fetch_closing.py data || echo "clôtures indisponibles"
            python clv.py out data/closing.csv
          fi
      - name: Entraînement final et page
        run: |
          python engine3_final.py /tmp/xg/data /tmp/of out
          ./mk.sh
      - name: Publier dans le dépôt
        run: |
          git config user.name "lambda90-bot"; git config user.email "bot@users.noreply.github.com"
          git add lambda-90.html out data
          git commit -m "Mise à jour quotidienne $(date -u +%F)" || echo "rien à publier"
          git pull --rebase && git push
