name: Mise à jour Lambda 90
on:
  schedule:
    - cron: "0 5 * * *"   # chaque jour 7 h (Paris, heure d'été)
  workflow_dispatch:
    inputs:
      cotes: { description: "Rafraîchir les cotes The Odds API (2 crédits par championnat qui joue dans les 48 h, 16 au plus)", type: boolean, default: true }
      reglage: { description: "Réglage et backtest complets (environ 45 minutes)", type: boolean, default: false }
  push:
    paths: ["lab/update_request.txt", "lab/odds_request.txt"]
concurrency: { group: lambda90-data, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install numpy pandas scipy scikit-learn statsmodels
      - name: Données ouvertes
        run: |
          git clone --depth 1 https://github.com/xgabora/Club-Football-Match-Data-2000-2025.git /tmp/xg
          git clone --depth 1 https://github.com/openfootball/football.json.git /tmp/of
      - name: Résultats récents (football-data.org)
        env: { FOOTBALL_DATA_TOKEN: "${{ secrets.FOOTBALL_DATA_TOKEN }}" }
        run: python pipeline/fetch_results.py
      - name: Cotes (The Odds API sur demande uniquement ; Bet365 et Pinnacle gratuits chaque jour)
        env:
          ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}"
          REFRESH: "${{ (github.event_name == 'workflow_dispatch' && inputs.cotes) || (github.event_name == 'push' && contains(toJSON(github.event.commits), 'lab/odds_request.txt')) }}"
        run: |
          if [ "$REFRESH" = "true" ]; then python pipeline/fetch_odds.py; else echo "The Odds API non appelée : rafraîchissement manuel uniquement (aucun crédit utilisé)"; fi
          python pipeline/fetch_fd_fixtures.py . || echo "cotes Bet365 indisponibles"
          python pipeline/odds_history.py .
          python pipeline/value_log.py .
      - name: Clôtures et journal de value
        run: |
          python pipeline/fetch_closing.py data || echo "clôtures indisponibles"
          python pipeline/value_eval.py .
      - name: Blessures et suspensions (API-Football)
        env: { API_FOOTBALL_KEY: "${{ secrets.API_FOOTBALL_KEY }}" }
        run: python pipeline/fetch_lineups.py jour out
      - name: Réglage et backtest complets (le lundi)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.reglage }}" = "true" ]; then
            python engine3.py /tmp/xg/data /tmp/of out tune
            python engine3.py /tmp/xg/data /tmp/of out full
            python engine3_eval.py out
            python clv.py out data/closing.csv
            python lab11_props.py /tmp/xg/data out || echo "labo 11 indisponible"
            python lab13_books.py . || echo "labo 13 indisponible"
            python lab14_contexte.py /tmp/xg/data . || echo "labo 14 indisponible"
          fi
      - name: Entraînement final et page
        run: |
          python engine3_final.py /tmp/xg/data /tmp/of out
          python pipeline/props_build.py /tmp/xg/data out || echo "corners et cartons indisponibles"
          python pipeline/h2h_build.py /tmp/xg/data . || echo "face-à-face indisponibles"
          python pipeline/insights_build.py . || echo "insights indisponibles"
          python pipeline/daily_picks.py . || echo "picks du jour indisponibles"
          ./mk.sh
      - name: Publier dans le dépôt
        run: |
          git config user.name "lambda90-bot"; git config user.email "bot@users.noreply.github.com"
          git add lambda-90.html site out data
          git commit -m "Mise à jour quotidienne $(date -u +%F)" || echo "rien à publier"
          git pull --rebase --autostash && git push
